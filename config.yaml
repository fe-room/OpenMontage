# OpenMontage - Global Configuration

llm:
  provider: anthropic            # anthropic | openai | gemini | openrouter | ollama | mistral | minimax
  model: null                    # null = use provider default
  temperature: 0.7
  max_tokens: 4096

budget:
  mode: warn                     # observe | warn | cap
  total_usd: 10.00
  reserve_pct: 0.10              # holdback for retries / cleanup
  single_action_approval_usd: 0.50
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative
  storage_dir: pipeline          # relative to project root

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23

# User production defaults. Pipeline proposals inherit these unless the user
# explicitly overrides them for a project.
media_defaults:
  background_music_enabled: false

narration_defaults:
  provider: doubao
  voice_name: "大壹 2.0"
  voice_id: zh_male_dayi_saturn_bigtts
  resource_id: seed-tts-2.0
  speech_rate: 0
  sample_approval_required: true
  # Keep one voice state across the full script. Script sections remain as
  # editorial/timing metadata; they are not separate TTS requests.
  generation_mode: single_pass

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output
