identity:
  name: "Custom Stock Ledger Vertical"
  category: custom
  mood: "trustworthy, auditable, calm, precise"
  pace: moderate
  best_for: "Portrait financial explainers that teach total return through exact money-flow animation"

visual_language:
  color_palette:
    primary: ["#111315", "#1B1F23", "#F3F0E8"]
    accent: ["#4ED08A", "#EA6A6A", "#E7C457"]
    background: "#111315"
    text: "#F3F0E8"
    muted: "#7A838D"
  composition: "Portrait six-column ledger grid; one primary relationship per frame; lower 360px reserved for captions"
  texture: "Matte graphite, faint audit lines, crisp value blocks; no gradients or glass effects"

typography:
  headings:
    font: "Noto Sans SC"
    weight: 700
    tracking: "0"
    line_height: 1.15
  body:
    font: "Noto Sans SC"
    weight: 400
    tracking: "0"
    line_height: 1.5
  stat_card:
    font: "DIN Alternate"
    weight: 700
    tracking: "0"
    line_height: 1.0
    size_multiplier: 3.5
  scale_system: major_third
  weight_matrix:
    title: 700
    heading: 700
    body: 400
    caption: 500

motion:
  transitions: ["ledger-line-wipe", "value-block-carry", "account-split", "hard-settlement-cut"]
  animation_style: "Weighted deterministic value-block motion with anticipation, slow-in/slow-out, and short settlement holds; no decorative bounce"
  pacing_rules:
    min_scene_hold_seconds: 5
    max_scene_hold_seconds: 18
    text_card_hold_seconds: 6
    stat_card_hold_seconds: 8
    transition_duration_seconds: 0.35
  entrance: "weighted slide or scale from the causal source"
  exit: "carry value into the next accounting state or hard cut after settlement"

audio:
  voice_style: "Doubao Dayi 2.0, calm response to a viewer question, normal speed, deliberate on arithmetic"
  music_mood: "none"
  music_volume: 0.0
  sfx_style: "Sparse quiet ledger ticks and one muted settlement tone; no rhythmic bed"
  ducking_threshold_db: -6
  voice_variation_allowed: false
  hero_moment_voice_shift: "Slow slightly and lower energy on the total-return result"
  transition_voice_shift: "Natural short pause at topic changes"

asset_generation:
  image_prompt_prefix: "Portrait documentary realism, quiet financial decision context, neutral practical environment, no visible brands or readable financial data, "
  image_negative_prompt: "trading screen, candlestick chart, coin rain, luxury wealth imagery, purple gradient, stock-photo handshake"
  diagram_style: "Custom hand-authored portrait ledger diagrams with tabular numbers, semantic colors, and conserved value-block area"
  consistency_anchors:
    - "Graphite #111315 canvas and warm paper #F3F0E8 text"
    - "Green #4ED08A only for newly created value"
    - "Red #EA6A6A only for losses"
    - "Yellow #E7C457 only for questions and cautions"
    - "Lower 360px stays clear for accessibility captions"

overlays:
  stat_card:
    bg: "#1B1F23"
    border: "#4ED08A"
    text: "#F3F0E8"
    radius: 6
    shadow: "none"
  key_term:
    bg: "#23282D"
    border: "#7A838D"
    text: "#F3F0E8"
    radius: 4

quality_rules:
  - "All exact numbers and formulas are rendered deterministically, never baked into stock or generated footage"
  - "Minimum text contrast ratio is 4.5:1"
  - "Large numbers never wrap and remain readable on a 360px-wide mobile preview"
  - "New information or a meaningful state change occurs every 7-10 seconds"
  - "Captions never duplicate a simultaneously displayed spoken headline"
  - "Every stock clip states its semantic contribution; decorative finance B-roll is rejected"
  - "The total-return balance signature device appears in no more than two scenes"

taste_profile:
  design_read: "A living audit trail for ordinary investors: precise enough to trust, calm enough to follow, and visually specific to the movement and creation of shareholder value"
  visual_variance: 6
  motion_intensity: 6
  information_density: 5
  palette_discipline: "Graphite and warm white base; green for created value, red for loss, yellow for unresolved questions"
  layout_variation: "Alternate message bubble, account slots, company process, branching paths, outcome field, relationship map, and capital allocation map"
  reference_strategy: "Render one representative still per scene at the assets gate before full composition"
  anti_patterns: ["generic AI finance palette", "candlestick wallpaper", "nested cards", "coin rain", "decorative B-roll"]
  quality_gates: ["Every arithmetic state is reconstructable", "Every scene has a distinct primary subject", "Mobile readability verified from scene stills"]

chart_palette: ["#4ED08A", "#EA6A6A", "#E7C457", "#7A838D"]

color_rules:
  harmony_type: split-complementary
  contrast_validation: true
  colorblind_safe: true

overrides:
  max_deviation_ratio: 0.1
  scene_overrides:
    - scene_id: "scene-22"
      reason: "Three-outcome climax uses the full green-yellow-red semantic palette."
    - scene_id: "scene-38"
      reason: "Final reconciliation reintroduces the total-return balance signature device."
