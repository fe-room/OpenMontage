name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: make install-dev

      - name: Run lint smoke checks
        run: make lint

      - name: Run test suite
        run: make test

  remotion:
    name: Validate Remotion / TypeScript
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: remotion-composer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run typecheck

      - name: Bundle Remotion project
        run: npm run bundle:remotion

      - name: Discover compositions
        run: npm run validate:remotion

      - name: Render Finance Dossier smoke stills
        run: npm run smoke:finance

      - name: Upload Finance Dossier smoke stills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-dossier-smoke-stills
          path: remotion-composer/out/finance-smoke/*.png
          if-no-files-found: warn
